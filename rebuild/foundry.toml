[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
# Via-IR is required by v4-core's PoolManager (stack depth). 200 runs compiles it and keeps the hook at
# ~20.8 KB, under EIP-170 (1000 runs hits a Yul stack error in Pool.swap; ≥10000 runs overflows EIP-170).
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 48
fail_on_revert = false
