name: formal-mind bot

# Triggered when a protocol repository pushes (see asyncswap/v2 .github/workflows/proofs-dispatch.yml
# and formalmind/tools/handle-proofs-dispatch.ts), or by hand.
on:
  repository_dispatch:
    types: [protocol-push]
  workflow_dispatch:
    inputs:
      repo:
        description: protocol repository (owner/name)
        required: true
        default: asyncswap/v2
      sha:
        description: full 40-character commit SHA to reconcile the spec with
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# One reconciliation at a time; later protocol pushes queue behind the running one.
concurrency:
  group: formal-mind-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Hard ceiling for one reconciliation; the bot's own budget is --max-turns below.
    timeout-minutes: 240
    env:
      FORMALMIND_APP_ID: ${{ secrets.FORMALMIND_APP_ID }}
      PROTO_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      PROTO_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      PROTO_MSG: ${{ github.event.client_payload.message || 'manual run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Check out the protocol commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTO_REPO }}
          ref: ${{ env.PROTO_SHA }}
          path: protocol
          token: ${{ secrets.PROTOCOL_READ_TOKEN || github.token }}
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.cache/mathlib
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-
      - run: lake exe cache get
      - name: Diff of the protocol commit
        id: diff
        run: |
          cd protocol
          git fetch --depth=2 origin "$PROTO_SHA" || true
          git diff --stat HEAD~1 HEAD -- src > ../protocol-diff.txt 2>/dev/null || echo "(no parent)" > ../protocol-diff.txt
          git diff HEAD~1 HEAD -- src >> ../protocol-diff.txt 2>/dev/null || true
      - name: formalmind App token (comments and PRs appear as formalmind[bot])
        id: app
        if: ${{ env.FORMALMIND_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FORMALMIND_APP_ID }}
          private-key: ${{ secrets.FORMALMIND_APP_PRIVATE_KEY }}
      # The roles are the formalmind plugin's skills (formalmind/skills), pinned: bump
      # FORMALMIND_SKILLS_REF (repository variable) to ship a change to them.
      - name: The formalmind skills, pinned
        uses: actions/checkout@v4
        with:
          repository: formalmind/skills
          ref: ${{ vars.FORMALMIND_SKILLS_REF || 'b13d7b5153f5272faba6cae06a0e4ae503deec04' }}
          path: .formalmind-skills
      - name: Keep the skills out of the project's commits
        run: echo .formalmind-skills >> .git/info/exclude
      - name: Run the formal-mind bot (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token || github.token }}
          plugin_marketplaces: ${{ github.workspace }}/.formalmind-skills
          plugins: formalmind@formalmind
          prompt: |
            Use the formalmind:reconcile skill and follow it exactly.
            PROTO_REPO=${{ env.PROTO_REPO }}
            PROTO_SHA=${{ env.PROTO_SHA }}
          # ~200 tool calls: a hard reconciliation is a few dozen edit/`lake build` cycles at 1-3 min each.
          claude_args: '--allowedTools "Bash(lake *),Bash(git diff *),Bash(git log *),Read,Edit,Write,Glob,Grep,Skill" --max-turns 200'
      - name: Gate on a clean build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          ! grep -rn --include='*.lean' -E '\bsorry\b' AsyncSwapSpec AsyncSwapProtocol
      - name: Changelog entry for the pull request body
        id: entry
        run: |
          {
            echo 'body<<FORMALMIND_EOF'
            awk '/<!-- formal-mind: insert new entries directly below this line -->/{f=1; next} f && /^## /{n++} f && n==2{exit} f' FORMAL_MIND.md
            echo 'FORMALMIND_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Open a pull request with the reconciled spec
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          base: dev
          branch: formal-mind/${{ env.PROTO_SHA }}
          add-paths: |
            AsyncSwapSpec/**
            AsyncSwapProtocol/**
            AsyncSwapSpec.lean
            AsyncSwapProtocol.lean
            README.md
            FORMAL_MIND.md
          title: "formal-mind: reconcile spec with ${{ env.PROTO_REPO }}@${{ env.PROTO_SHA }}"
          commit-message: |
            spec: reconcile with ${{ env.PROTO_REPO }}@${{ env.PROTO_SHA }}

            ${{ env.PROTO_MSG }}
          body: |
            Automated reconciliation of the Lean spec with `${{ env.PROTO_REPO }}@${{ env.PROTO_SHA }}`.
            `lake build` passed with no `sorry` before this PR was opened.

            ${{ steps.entry.outputs.body }}

            🤖 formal-mind run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Report a failed reconciliation as an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The formal-mind bot could not reconcile the spec with \`$PROTO_REPO@$PROTO_SHA\` ($PROTO_MSG)."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Build errors (if the bot ran out of budget or left a proof open):"
            echo
            echo '```'
            { grep -A6 '^error:' build.log 2>/dev/null | head -80; } || echo "(no build log: the bot step itself failed)"
            echo '```'
            echo
            echo "Comment \`@formalmind retry\` here, or run the workflow by hand with the full sha, once the cause is fixed."
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "formal-mind: reconciliation failed for $PROTO_REPO@${PROTO_SHA:0:7}" \
            --body-file issue.md
