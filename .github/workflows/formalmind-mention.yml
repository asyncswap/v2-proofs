name: "@formalmind"

# Tag @formalmind in an issue, pull request, review or comment to summon the bot. It reads the
# thread, answers as formalmind[bot] with ordinary comments (code blocks, permalinks, inline
# review comments) and, on a pull request, can push commits to the PR branch. How it talks and
# works is described in .github/formalmind-mention.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  formalmind:
    # Only humans summon the bot: its own replies never re-trigger this workflow.
    if: |
      github.event.sender.type == 'User' && (
        contains(github.event.comment.body, '@formalmind') ||
        contains(github.event.review.body, '@formalmind') ||
        contains(github.event.issue.body, '@formalmind') ||
        contains(github.event.issue.title, '@formalmind'))
    runs-on: ubuntu-latest
    env:
      FORMALMIND_APP_ID: ${{ secrets.FORMALMIND_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: formalmind App token (comments, commits and PRs appear as formalmind[bot])
        id: app
        if: ${{ env.FORMALMIND_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FORMALMIND_APP_ID }}
          private-key: ${{ secrets.FORMALMIND_APP_PRIVATE_KEY }}
      - name: Work out where we were summoned and check out the PR branch if there is one
        id: ctx
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          event="$GITHUB_EVENT_PATH"
          react_url=""
          case "$GITHUB_EVENT_NAME" in
            issue_comment)
              number=$(jq -r '.issue.number' "$event")
              author=$(jq -r '.comment.user.login' "$event")
              trigger=comment
              react_url="repos/$GITHUB_REPOSITORY/issues/comments/$(jq -r '.comment.id' "$event")/reactions"
              if [ "$(jq -r '.issue.pull_request // empty' "$event")" != "" ]; then kind=pr; else kind=issue; fi ;;
            pull_request_review_comment)
              number=$(jq -r '.pull_request.number' "$event")
              author=$(jq -r '.comment.user.login' "$event")
              trigger=review_comment; kind=pr
              react_url="repos/$GITHUB_REPOSITORY/pulls/comments/$(jq -r '.comment.id' "$event")/reactions" ;;
            pull_request_review)
              number=$(jq -r '.pull_request.number' "$event")
              author=$(jq -r '.review.user.login' "$event")
              trigger=review; kind=pr ;;  # review bodies cannot be reacted to
            issues)
              number=$(jq -r '.issue.number' "$event")
              author=$(jq -r '.issue.user.login' "$event")
              trigger="issue_$(jq -r '.action' "$event")"; kind=issue
              react_url="repos/$GITHUB_REPOSITORY/issues/$number/reactions" ;;
          esac
          # 👀 on the message right away, so the author knows the bot saw it
          if [ -n "$react_url" ]; then
            gh api -X POST "$react_url" -f content=eyes --silent || true
          fi
          if [ "$kind" = pr ]; then
            gh pr checkout "$number"
          fi
          {
            echo "number=$number"
            echo "author=$author"
            echo "trigger=$trigger"
            echo "kind=$kind"
            echo "react_url=$react_url"
            echo "branch=$(git branch --show-current)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.cache/mathlib
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-
      - run: lake exe cache get
      - uses: anthropics/claude-code-action@v1
        env:
          # gh inside the bot's shell posts and pushes as formalmind[bot]
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token || github.token }}
          bot_name: "formalmind[bot]"
          bot_id: "213248595"
          include_fix_links: "false"
          # A prompt (rather than trigger_phrase) runs the action without its tracking comment,
          # so the bot's own comments are the only thing that appears on the thread.
          prompt: |
            Read .github/formalmind-mention.md and follow it. Then handle the mention below.

            REPO=${{ github.repository }}
            KIND=${{ steps.ctx.outputs.kind }}
            NUMBER=${{ steps.ctx.outputs.number }}
            TRIGGER=${{ steps.ctx.outputs.trigger }}
            AUTHOR=${{ steps.ctx.outputs.author }}
            BRANCH=${{ steps.ctx.outputs.branch }}
            SHA=${{ steps.ctx.outputs.sha }}
            REACT_URL=${{ steps.ctx.outputs.react_url }}
            RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Title: ${{ github.event.issue.title || github.event.pull_request.title }}

            The message from @${{ steps.ctx.outputs.author }} that summoned you:
            ---
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
            ---
          claude_args: >-
            --allowedTools "Bash(lake:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh api repos/${{ github.repository }}:*),mcp__github_inline_comment__create_inline_comment,Read,Edit,Write,Glob,Grep"
            --max-turns 80
